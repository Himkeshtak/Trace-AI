name: TraceAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Python services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install service and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r consumer/requirements.txt -r persistence/requirements.txt -r simulator/requirements.txt pytest PyYAML
      - name: Compile Python sources
        run: python -m compileall -q backend consumer persistence simulator shared airflow/dags tests
      - name: Run tests
        run: python -m pytest -q
      - name: Validate Compose model
        run: docker compose config --quiet

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Build production dashboard
        run: pnpm run build
