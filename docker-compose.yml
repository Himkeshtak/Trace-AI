name: traceai

services:
  postgres:
    image: postgres:16-alpine
    container_name: traceai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traceai}
      POSTGRES_USER: ${POSTGRES_USER:-traceai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceai_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traceai} -d ${POSTGRES_DB:-traceai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [traceai]

  kafka:
    image: apache/kafka:3.9.0
    container_name: traceai-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [traceai]

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: traceai-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - trace-events
      - --partitions
      - "3"
      - --replication-factor
      - "1"
    networks: [traceai]

  redis:
    image: redis:7.4-alpine
    container_name: traceai-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [traceai]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traceai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://traceai:traceai_dev_password@postgres:5432/traceai}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-trace-events}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ANALYTICS_CACHE_TTL_SECONDS: ${ANALYTICS_CACHE_TTL_SECONDS:-30}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [traceai]

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: traceai-consumer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://traceai:traceai_dev_password@postgres:5432/traceai}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-trace-events}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-traceai-storage}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    networks: [traceai]

  simulator:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: simulator/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    command: ["--base-url", "http://backend:8000/api/v1", "--executions", "250"]
    networks: [traceai]

  airflow:
    build:
      context: ./airflow
    container_name: traceai-airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_USER:-airflow}:${AIRFLOW_PASSWORD:-airflow_dev_password}@postgres:5432/${AIRFLOW_DB:-airflow}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Kolkata
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      TRACEAI_DATABASE_URL: postgresql://${POSTGRES_USER:-traceai}:${POSTGRES_PASSWORD:-traceai_dev_password}@postgres:5432/${POSTGRES_DB:-traceai}
      AIRFLOW_CONN_TRACEAI_POSTGRES: postgresql://${POSTGRES_USER:-traceai}:${POSTGRES_PASSWORD:-traceai_dev_password}@postgres:5432/${POSTGRES_DB:-traceai}
    command: standalone
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
    networks: [traceai]

networks:
  traceai:
    name: traceai-network

volumes:
  postgres_data:
  redis_data:
  airflow_logs:
